name: Axonhub
options:
  bundleIdPrefix: com.khixang
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: "zh-Hans"
  knownRegions: ["zh-Hans", "zh-Hant", "en", "ja", "ko", "Base"]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "29"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Axonhub:
    type: application
    platform: iOS
    sources:
      - path: Axonhub
    info:
      path: build/Info.plist
      properties:
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
          - ja
          - ko
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khixang.axon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Axonhub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接本地或局域网内的 AxonHub AI 网关
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconDark"
        CFBundleDevelopmentRegion: "zh-Hans"
  AxonhubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AxonhubTests]
    dependencies:
      - target: Axonhub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AxonhubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AxonhubUITests]
    dependencies:
      - target: Axonhub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Axonhub:
    build:
      targets:
        Axonhub: all
    test:
      targets: [AxonhubTests, AxonhubUITests]
