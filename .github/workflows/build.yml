name: Build IPA
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'Axonhub/**'
      - 'AxonhubTests/**'
      - 'AxonhubUITests/**'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - 'project.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and install XcodeGen
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, subprocess
          apps = sorted(glob.glob('/Applications/Xcode_26*.app'))
          if not apps:
              raise SystemExit('Xcode 26 missing')
          subprocess.run(['sudo','xcode-select','-s',apps[-1]+'/Contents/Developer'],check=True)
          PY
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Verify native presentation coverage and real Swift behavior
        run: python3 -B scripts/check-presentation.py --swift
      - name: Verify bundled brand marks and native icon mapping
        run: python3 -B scripts/check-brand-icons.py --swift
      - name: Check Swift integration source guards
        run: python3 -B scripts/check-swift-integration.py
      - name: Check all localization resources and source coverage
        run: python3 scripts/check-localizations.py
      - name: Verify all GraphQL operations against official deployed schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv build/contract-venv
          build/contract-venv/bin/pip install 'graphql-core==3.3.0'
          build/contract-venv/bin/python scripts/check-api-contract.py
      - name: Verify system icon source variants
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          base = pathlib.Path('Axonhub/Assets.xcassets')
          for name in ['AppIcon', 'AppIconLight', 'AppIconDark']:
              folder = base / (name + '.appiconset')
              images = json.loads((folder / 'Contents.json').read_text())['images']
              light = [x for x in images if not x.get('appearances')]
              dark = [x for x in images if {'appearance': 'luminosity', 'value': 'dark'} in x.get('appearances', [])]
              assert len(light) == len(dark) == 1, name
              for variant in light + dark:
                  raw = (folder / variant['filename']).read_bytes()
                  assert raw[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', raw[16:24]) == (1024, 1024)
                  if variant in dark:
                      assert raw[25] == 6, f'{name}: Dark must have RGBA transparency'
              print(name, 'Any/Dark source manifest and PNG format verified')
          PY
      - name: Build unsigned device archive and IPA
        run: |
          set -euo pipefail
          xcodebuild archive -project Axonhub.xcodeproj -scheme Axonhub -configuration Release -destination 'generic/platform=iOS' -archivePath build/Axonhub.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee archive.log
          xcrun --sdk iphoneos assetutil --info build/Axonhub.xcarchive/Products/Applications/Axonhub.app/Assets.car > build/icon-assets.json
          python3 - <<'PY'
          import json
          assets=json.load(open('build/icon-assets.json'))
          icons=[x for x in assets if 'AppIcon' in x.get('Name','')]
          print(json.dumps(icons,indent=2))
          assert icons, 'Compiled AppIcon is missing'
          for name in ['AppIcon', 'AppIconLight', 'AppIconDark']:
              for idiom in ['phone', 'pad']:
                  variants = [x for x in icons if x.get('Name') == name and x.get('Idiom') == idiom and x.get('AssetType') == 'Icon Image']
                  light = [x for x in variants if not x.get('Appearance')]
                  dark = [x for x in variants if x.get('Appearance') == 'UIAppearanceDark']
                  assert light and dark, f'{name} Any/Dark variants missing for {idiom}'
                  assert all(x.get('Opaque') is False for x in dark), f'{name}: Dark alpha lost for {idiom}'
                  assert all(x.get('Opaque') is True for x in light), f'{name}: Any must remain opaque for {idiom}'
                  assert {x['SHA1Digest'] for x in light}.isdisjoint({x['SHA1Digest'] for x in dark}), f'{name} variants identical for {idiom}'
          PY
          python3 -B scripts/check-brand-icons.py --compiled build/icon-assets.json
          mkdir -p build/ipa/Payload
          cp -R build/Axonhub.xcarchive/Products/Applications/Axonhub.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Axonhub-App-iOS-unsigned.ipa Payload)
          python3 - <<'PY'
          import zipfile, plistlib
          path='build/Axonhub-App-iOS-unsigned.ipa'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/Axonhub.app/Info.plist'))
              assert info['MinimumOSVersion']=='16.0'
              assert info['CFBundleIdentifier']=='com.khixang.axon'
              assert info['CFBundleDisplayName']=='Axonhub'
              for key in ['CFBundleIcons','CFBundleIcons~ipad']:
                  assert info[key]['CFBundlePrimaryIcon']['CFBundleIconName'] == 'AppIcon'
                  assert set(info[key]['CFBundleAlternateIcons']) == {'AppIconLight','AppIconDark'}
              assert info['CFBundleShortVersionString']=='1.0.0'
              assert info['CFBundleVersion']=='28'
              assert set(info.get('CFBundleLocalizations', [])) == {'zh-Hans', 'zh-Hant', 'en', 'ja', 'ko'}
              assert 'Payload/Axonhub.app/Axonhub' in z.namelist()
              notices = z.read('Payload/Axonhub.app/BrandIcons-LICENSE.txt').decode()
              assert 'MIT License' in notices and 'Apache License' in notices
              print(info['CFBundleIdentifier'],info['MinimumOSVersion'],info['CFBundleShortVersionString'])
          PY
          python3 scripts/check-localizations.py --ipa build/Axonhub-App-iOS-unsigned.ipa
          shasum -a 256 build/Axonhub-App-iOS-unsigned.ipa > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Axonhub-App-iOS-unsigned
          path: |
            build/Axonhub-App-iOS-unsigned.ipa
            build/SHA256SUMS.txt
            build/icon-assets.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: archive.log
